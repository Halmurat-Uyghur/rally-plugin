kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true

# IntelliJ Platform bundles its own Kotlin stdlib; suppress the Kotlin Gradle
# plugin's automatic stdlib dependency so we don't risk a version mismatch
# at runtime. Recommended by:
#   https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
