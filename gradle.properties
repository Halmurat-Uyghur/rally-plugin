kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true

# The Kotlin 2.0 Gradle plugin upgrade clears the last Gradle-10 deprecation that
# blocked the configuration cache, so enable it here for faster repeat builds.
org.gradle.configuration-cache=true

# IntelliJ Platform bundles its own Kotlin stdlib; suppress the Kotlin Gradle
# plugin's automatic stdlib dependency so we don't risk a version mismatch
# at runtime. Recommended by:
#   https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
